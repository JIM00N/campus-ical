<li><strong>Apple 캘린더 (iPhone/Mac)</strong>: "캘린더 추가" → "구독 캘린더 추가" → 위 URL 붙여넣기</li>
<li><strong>Outlook</strong>: 캘린더 → "캘린더 추가" → "웹에서 구독" → 위 URL 붙여넣기</li>
